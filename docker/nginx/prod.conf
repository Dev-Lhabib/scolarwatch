# ScolarWatch production Nginx configuration.
#
# Reverse-proxies / FastCGI-fronts the production Laravel runtime image
# (Task #1 Dockerfile: php:8.4-fpm-alpine, FPM pool listening on 9000, running
# as the non-root `app` user). Nginx and PHP-FPM are separate containers linked
# over the Docker network by service name -> app:9000.
#
# Mount this file into an official nginx image as:
#     /etc/nginx/conf.d/default.conf
#
# The production domain is supplied later through configuration: replace the
# `server_name` placeholder below when it is provisioned.

server {
    listen 80;
    listen [::]:80;

    # Placeholder: set to the real domain (e.g. yourdomain.com www.yourdomain.com)
    # when provisioned. `_` accepts any Host header.
    server_name _;

    server_tokens off;

    # Laravel public root, baked into the runtime image.
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    autoindex off;

    # --- Request/body limits ------------------------------------------------
    client_max_body_size 25m;
    client_body_timeout  30s;
    client_header_timeout 30s;
    send_timeout          60s;

    # --- Logging -------------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # --- Basic gzip for text-based responses ----------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss image/svg+xml;

    # --- Basic security headers ------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Front controller -----------------------------------------------------
    # SPA + API: let Laravel resolve the route, fall back to index.php.
    location / {
        try_files $uri $uri/ /index.php$is_args$query_string;
    }

    # --- PHP via FastCGI --------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Guard against the httpoxy vulnerability (clear_env=no leaks env to PHP).
        fastcgi_param HTTP_PROXY "";
        # Correct scheme when running behind a TLS-terminating proxy/LB.
        fastcgi_param HTTPS $https if_not_empty;

        # Forward the client's identity/protocol to the application.
        # HTTP_* keys are exposed to PHP-FPM as $_SERVER['HTTP_*'], i.e. real
        # request headers that Laravel/Symfony can consume (TrustProxies).
        fastcgi_param HTTP_HOST              $host;
        fastcgi_param REMOTE_ADDR            $remote_addr;
        fastcgi_param HTTP_X_REAL_IP         $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;

        # PHP-FPM container, resolved by Docker's DNS (service name `app`).
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;

        # Dynamic responses must never be cached by proxies/browsers.
        add_header Cache-Control "no-cache, private" always;
    }

    # --- Static assets -----------------------------------------------------------
    # Vite build output is content-hashed: cache long, cache immutable.
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Other cacheable static assets (images, fonts, css/js outside /build).
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp|avif)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- Sensitive / non-public files: deny ---------------------------------------
    # Allow ACME challenge dir for future TLS provisioning, deny every other dotfile
    # (covers .env, .env.*, .git, .htaccess, .gitignore, ...). `^~` prefix wins over
    # the regex below.
    location ^~ /.well-known/ {
        allow all;
    }

    location ~ /\. {
        deny all;
    }

    # Defense in depth for Laravel project files that must never be served.
    location ~ ^/(composer\.(json|lock)|package\.json|package-lock\.json|artisan|webpack\.config\.js|vite\.config\.js|README\.md)$ {
        deny all;
    }

    location ~ ^/(storage|bootstrap|config|database|vendor|tests)/ {
        deny all;
    }
}
