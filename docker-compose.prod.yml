# ScolarWatch production stack.
#
# Run from the project root with:
#     docker compose --env-file .env.production -f docker-compose.prod.yml up -d
#
# .env.production is the single source of truth for app config and secrets
# (copy .env.production.example to .env.production, set real values, then run
# `docker compose ... exec app php artisan key:generate`).
# Mandatory MySQL variables use ${VAR:?} so the stack refuses to start when they
# are missing. APP_PORT (default 8080) is the only published host port; Nginx
# fronts PHP-FPM while MySQL/Redis stay on the private Docker network.

name: scolarwatch-prod

services:
  app:
    image: scolarwatch:prod
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  queue:
    image: scolarwatch:prod
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--timeout=120"]
    env_file: .env.production
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    # The image HEALTHCHECK probes PHP-FPM :9000, which this container does not
    # run (its PID 1 is the queue worker), so use a process-liveness probe that
    # matches the worker command line instead of disabling the check.
    healthcheck:
      test: ["CMD-SHELL", "ps -o args | grep -q '[q]ueue:work'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    image: scolarwatch:nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.production}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env.production}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env.production}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.production}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_storage:
  app_bootstrap_cache:
  mysql_data:
  redis_data:
